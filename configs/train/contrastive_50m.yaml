# Stage 5/6 style contrastive fine-tuning, 50M model (a probe: short, no hard negatives).
model: 50m
init_from: decay-10.00B/latest.pt # RUN/FILE under RUNS_DIR; its encoder weights initialize the model

data:
  name: webfaq # a name or a list of names: <PAIRS_DIR>/<name>/*.parquet (src.data.build_pairs)
  parallel_fraction: 0.0 # share of steps drawn from par_*.parquet translation files (build_parallel)
  val_per_language: 1000 # held out; the training pairs are the rest
  max_query: 64 # tokens
  max_passage: 256
  query_width: 512 # packing row width in tokens (multiple of 128)
  passage_width: 1024

batch:
  pairs: 512 # in-batch negatives: 511 per query; every batch is one language
  chunk_queries: 256 # GradCache chunk sizes (texts per forward pass)
  chunk_passages: 64

loss:
  temperature: 0.05 # the Matryoshka dims come from the model config

optim:
  lr: 1.0e-4
  betas: [0.9, 0.98]
  weight_decay: 0.01
  max_grad_norm: 1.0

schedule:
  total_pairs: 1.0e6 # about 2000 steps
  warmup_fraction: 0.05

eval:
  every_steps: 250
checkpoint:
  every_steps: 250

log_every_steps: 10
seed: 0
