[build-system]
requires = ["setuptools>=78,<79"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-model"
version = "0.1.0"
description = "From-scratch multilingual text embedding models (50M / 100M / 200M) trained on one RTX 5090"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # CUDA 13.0 build; install with --extra-index-url https://download.pytorch.org/whl/cu130
    "torch==2.14.1",
    "pyyaml==6.0.3",
    "huggingface_hub==2.4.0",
    "pyarrow==26.0.1",
    "tokenizers==0.23.3",
    "numpy==2.5.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.4",
]
eval = [
    "transformers==5.22.2",  # baseline models for src/eval
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
